name: issue 78 exact D1 predicate runtime

on:
  push:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/src/harness_predicate_ops_d1.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  pull_request:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/src/harness_predicate_ops_d1.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  workflow_dispatch:

jobs:
  predicate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify ratified target pin
        run: |
          grep -F 'b5ec3211f6bd07fb7c4a5f704875892eff145b91' harness/Cargo.toml
          grep -F 'b5ec3211f6bd07fb7c4a5f704875892eff145b91' harness/Cargo.lock
      - name: Semantic authority audit
        run: cargo test --manifest-path harness/Cargo.toml --locked --test semantic_authority -- --nocapture
      - name: Execute PredicateBit carrier witness
        run: cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-bit
      - name: Execute current-D1 ATOM/EQ witness
        run: cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-ops-d1

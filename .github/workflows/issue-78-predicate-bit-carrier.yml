name: issue 78 PredicateBit carrier candidate

on:
  push:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  pull_request:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  workflow_dispatch:

jobs:
  candidate-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify candidate target pin
        run: |
          grep -F 'fbafef50e408c0cdf6ed1f21a8743b80341b919a' harness/Cargo.toml
          grep -F 'fbafef50e408c0cdf6ed1f21a8743b80341b919a' harness/Cargo.lock
      - name: Semantic authority audit
        run: cargo test --manifest-path harness/Cargo.toml --locked --test semantic_authority -- --nocapture
      - name: Execute PredicateBit carrier witness
        run: cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-bit

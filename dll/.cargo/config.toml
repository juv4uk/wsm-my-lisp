# asm/nucleus-win64.s's arena (wsm_arena/wsm_arena_next/wsm_arena_end) is
# a single global mutable bump allocator with NO synchronization -- by
# design, matching asm/nucleus.s's own SysV original (a single-threaded
# embedding is the assumed use case: one mod-script evaluator per game
# process). cargo test's default multi-threaded unit-test runner violates
# that assumption and DID corrupt results in practice during development
# (eval::tests::cond_* failing nondeterministically with wrong values/
# NotCallable, from two test threads racing on the same arena pointer) --
# not a hypothetical concern, a reproduced failure. Forcing single-threaded
# test execution here is the fix for THIS crate's test suite; it does not
# make the arena itself thread-safe, which would be a real asm/design
# change (a locked or per-thread arena) out of scope for this fix.
[env]
RUST_TEST_THREADS = "1"

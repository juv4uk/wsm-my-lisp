[package]
name = "wsm-my-lisp-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
# Представлення цільового слова беремо з ратифікованого target contract,
# а не дублюємо теги/канонічне t у witness-коді.
wsm-os-target = { git = "https://github.com/juv4uk/wsm-target-contract.git", rev = "bb6e119", package = "wsm-os-target" }

[[bin]]
name = "harness-atom"
path = "src/harness_atom.rs"

[[bin]]
name = "harness-atom-cons"
path = "src/harness_atom_cons.rs"

[[bin]]
name = "harness-car-type-trigger"
path = "src/harness_car_type_trigger.rs"

[[bin]]
name = "harness-closure-type-trigger"
path = "src/harness_closure_type_trigger.rs"

[[bin]]
name = "harness-lambda"
path = "src/harness_lambda.rs"

[[bin]]
name = "harness-cons"
path = "src/harness_cons.rs"

[[bin]]
name = "harness-eq"
path = "src/harness_eq.rs"

[[bin]]
name = "harness-eq-symbol"
path = "src/harness_eq_symbol.rs"

[[bin]]
name = "harness-countdown"
path = "src/harness_countdown.rs"

[[bin]]
name = "harness-closure"
path = "src/harness_closure.rs"

[[bin]]
name = "harness-cond"
path = "src/harness_cond.rs"

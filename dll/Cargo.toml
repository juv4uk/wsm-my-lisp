[package]
name = "wsm-my-lisp-cyberpunk-dll"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the commit that ratifies Tag::Boxed=7 (contract v3) --
# docs/migration-2026-09-10-boxed-tag.md in wsm-target-contract. Consumes
# the canonical Tag enum and encode_boxed/decode_boxed instead of this
# crate's own local TAG_BOXED constant, per that migration note's own
# instruction to wsm-my-lisp.
wsm-os-target = { git = "https://github.com/juv4uk/wsm-target-contract.git", rev = "bb6e119", package = "wsm-os-target" }

[lib]
# rlib in addition to cdylib so `cargo test` can link the primitive
# smoke tests below; the shipped artifact is still the cdylib.
crate-type = ["cdylib", "rlib"]

[[bin]]
# Deliberately exhausts the 4096-byte arena and exits via wsm_fail_win64.
# A unit test can't exercise this in-process (it calls process::exit,
# which would kill the whole test runner) -- tests/oom_path.rs spawns
# this as a subprocess instead and checks its exit code/stderr.
name = "oom-trigger"
path = "src/bin/oom_trigger.rs"

[[bin]]
# Manual timing harness (std::time::Instant, no criterion/nightly
# dependency) for wsm_eval_string, the FFI marshaling overhead specifically,
# and BoxedTable growth. Run with --release: debug-profile numbers are not
# representative of what a game process would actually see.
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
# Keep debug info in release builds so a profiler could still symbolize
# this bench binary if that's ever needed -- negligible cost for a small
# crate like this.
debug = true

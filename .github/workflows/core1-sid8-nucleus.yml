name: Core1 SID8 nucleus witness

on:
  pull_request:
    paths:
      - "asm/nucleus.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_sid8.rs"
      - "harness/src/harness_sid8_trigger.rs"
      - "harness/tests/sid8_error_path.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/core1-sid8-nucleus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sid8-nucleus:
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TARGET_CONTRACT_COMMIT: d3663026dbcce73e2b8e32238910c3f8f7dea833
    steps:
      - name: Checkout wsm-my-lisp without unrelated private submodules
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Verify pinned target contract from GitHub
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/juv4uk/wsm-target-contract.git "$RUNNER_TEMP/wsm-target-contract"
          git -C "$RUNNER_TEMP/wsm-target-contract" cat-file -e "$TARGET_CONTRACT_COMMIT^{commit}"

      - name: Diff hygiene
        run: git diff --check

      - name: Rustfmt focused new harness files
        run: |
          rustfmt --edition 2021 --check \
            harness/src/harness_sid8.rs \
            harness/src/harness_sid8_trigger.rs \
            harness/tests/sid8_error_path.rs

      - name: Target projection guard
        run: cargo test --manifest-path harness/Cargo.toml --locked --test semantic_authority

      - name: SID8 fail-closed paths
        run: cargo test --manifest-path harness/Cargo.toml --locked --test sid8_error_path -- --nocapture

      - name: Exhaustive exact 8-bit round-trip
        shell: bash
        run: |
          set -euo pipefail
          actual="$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-sid8)"
          printf '%s\n' "$actual"
          test "$actual" = "sid8 boxed transport: 256/256 exact"

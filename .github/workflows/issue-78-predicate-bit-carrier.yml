name: issue 78 exact D1 predicate runtime

on:
  push:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/src/harness_predicate_ops_d1.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  pull_request:
    paths:
      - "asm/nucleus.s"
      - "asm/nucleus-win64.s"
      - "harness/Cargo.toml"
      - "harness/Cargo.lock"
      - "harness/src/harness_predicate_bit.rs"
      - "harness/src/harness_predicate_ops_d1.rs"
      - "harness/tests/semantic_authority.rs"
      - ".github/workflows/issue-78-predicate-bit-carrier.yml"
  workflow_dispatch:

jobs:
  predicate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify ratified target pin
        run: |
          grep -F 'd3663026dbcce73e2b8e32238910c3f8f7dea833' harness/Cargo.toml
          grep -F 'd3663026dbcce73e2b8e32238910c3f8f7dea833' harness/Cargo.lock
      - name: Semantic authority audit
        run: cargo test --manifest-path harness/Cargo.toml --locked --test semantic_authority -- --nocapture
      - name: Execute PredicateBit carrier witness
        run: cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-bit
      - name: Execute current-D1 ATOM/EQ witness
        run: cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-ops-d1
      - name: Exact D1 EQ pair input fails through Type path
        shell: bash
        run: |
          set +e
          cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-predicate-ops-d1 -- --pair-eq-type-error
          status=$?
          set -e
          test "$status" -eq 97

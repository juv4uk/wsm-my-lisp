name: deep self-hosting gate

on:
  schedule:
    # 00:30 UTC = 03:30 in Ukraine during summer time, 02:30 in winter.
    - cron: "30 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deep-self-hosting.yml"

permissions:
  contents: read

concurrency:
  group: deep-self-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sysv-deep:
    name: SysV full semantic witness corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned my-lisp semantic authority
        shell: bash
        run: |
          expected=6d71151c7b3fd1825f4523087b176bdbe45ec809
          actual="$(git -C external/my-lisp rev-parse HEAD)"
          test "$actual" = "$expected"
          test -f external/my-lisp/lib/meta-eval.my
          grep -q '^(def my-eval-cond-result$' external/my-lisp/lib/meta-eval.my
          grep -q '^(def my-eval-result$' external/my-lisp/lib/meta-eval.my

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run complete harness test surface
        run: cargo test --manifest-path harness/Cargo.toml --locked --all-targets --verbose

      - name: Build release witness binaries
        run: cargo build --manifest-path harness/Cargo.toml --locked --release --bins

      - name: Execute release witnesses
        shell: bash
        run: |
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-atom)" = "t"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-atom-cons)" = "wsm_atom: (atom ()) -> t, (atom (cons radio antenna)) -> ()  [both correct]"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-cons)" = "(A . B)"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-eq)" = "wsm_eq: (eq 41 41) -> t, (eq 41 42) -> ()  [both correct]"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-eq-symbol)" = "wsm_eq: (eq radio radio) -> t, (eq radio antenna) -> ()  [both correct]"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-lambda)" = "7"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-countdown)" = "countdown 100000 -> done"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-closure)" = "closure identity: definition=17 env=42 self-eq=t peer-eq=()"
          test "$(cargo run --quiet --release --manifest-path harness/Cargo.toml --locked --bin harness-cond)" = "cond: (cond (() (quote wrong)) (t (quote right))) -> right"

      - name: Record evidence strength
        if: always()
        shell: bash
        run: |
          {
            echo '### SysV deep evidence'
            echo '- semantic authority pin: checked'
            echo '- full harness test surface: attempted'
            echo '- release binaries: built and executed'
            echo '- bounded recursion witness: N=100000'
            echo '- closure identity witness: executed against asm nucleus'
          } >> "$GITHUB_STEP_SUMMARY"

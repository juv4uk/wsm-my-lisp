name: Core1 compiler self-source

on:
  pull_request:
    paths:
      - "lib/compiler.lisp"
      - "scripts/check-core1-compiler-consumer.sh"
      - ".github/workflows/core1-compiler-self-source.yml"
  workflow_dispatch:

jobs:
  core1-compiler-self-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout wsm-my-lisp with full local history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone exact source histories from GitHub
        shell: bash
        run: |
          set -euo pipefail
          # Source histories are cloned from GitHub, never from /home/agents.
          git clone --quiet https://github.com/juv4uk/sens.git "$GITHUB_WORKSPACE/sens-upstream"
          git clone --quiet https://github.com/juv4uk/mccarthy-eval.git "$GITHUB_WORKSPACE/mccarthy-eval"
          git -C "$GITHUB_WORKSPACE/sens-upstream" log -1 --format='sens %H'
          git -C "$GITHUB_WORKSPACE/mccarthy-eval" log -1 --format='mccarthy-eval %H'

      - name: Run exact Core1 compiler consumer/self-source witness
        env:
          SENS_REPO: ${{ github.workspace }}/sens-upstream
          MCCARTHY_EVAL_REPO: ${{ github.workspace }}/mccarthy-eval
        run: scripts/check-core1-compiler-consumer.sh

name: self-hosting authority + SysV witnesses

on:
  push:
    branches: [main]
    paths:
      - "asm/**"
      - "harness/**"
      - "scripts/**"
      - "docs/AUTHORITY.md"
      - "docs/dll-inventory-2026-09-11.md"
      - "external/sens"
      - ".github/workflows/self-hosting-authority.yml"
  pull_request:
    paths:
      - "asm/**"
      - "harness/**"
      - "scripts/**"
      - "docs/AUTHORITY.md"
      - "docs/dll-inventory-2026-09-11.md"
      - "external/sens"
      - ".github/workflows/self-hosting-authority.yml"
  workflow_dispatch:

jobs:
  authority-and-witnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build my-lisp CLI (pinned SENS authority e274400c)
        run: |
          cargo build --release --locked --manifest-path external/sens/Cargo.toml -p sens-cli

      - name: Lisp-first authority guard (P0 #15)
        shell: bash
        run: |
          external/sens/target/release/my-lisp scripts/check-lisp-first-authority.lisp || { cat .guard-report.txt 2>/dev/null; exit 1; }

      - name: Machine contract gate (P0 #23)
        shell: bash
        run: |
          external/sens/target/release/my-lisp scripts/check-machine-contracts.lisp || { cat .guard-report.txt 2>/dev/null; exit 1; }

      - name: Verify pinned my-lisp semantic authority
        shell: bash
        run: |
          expected=e274400c7ef16d826b9220321094d624b450269c
          actual="$(git -C external/sens rev-parse HEAD)"
          test "$actual" = "$expected"
          test -f external/sens/lib/meta-eval.lisp
          grep -q '^(00001001 my-eval-cond-result$' external/sens/lib/meta-eval.lisp
          grep -q '^(00001001 my-eval-result$' external/sens/lib/meta-eval.lisp

      - name: Check semantic authority guard
        run: |
          cargo test --manifest-path harness/Cargo.toml --locked --test semantic_authority

      - name: Check compiler-corpus parity doc hasn't silently drifted (wsm-my-lisp#4)
        run: |
          cargo test --manifest-path harness/Cargo.toml --locked --test compiler_corpus_parity

      - name: Check wsm_car's Type-error path actually aborts, not just compiles
        run: |
          cargo test --manifest-path harness/Cargo.toml --locked --test type_error_path

      - name: Compile all SysV witness binaries
        run: |
          cargo test --manifest-path harness/Cargo.toml --locked --no-run

      - name: Execute atom witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-atom)" = "t"

      - name: Execute atom-on-cons witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-atom-cons)" = "wsm_atom: (atom ()) -> t, (atom (cons radio antenna)) -> ()  [both correct]"

      - name: Execute cons witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-cons)" = "(A . B)"

      - name: Execute eq witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-eq)" = "wsm_eq: (eq 41 41) -> t, (eq 41 42) -> ()  [both correct]"

      - name: Execute eq-on-symbol witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-eq-symbol)" = "wsm_eq: (eq radio radio) -> t, (eq radio antenna) -> ()  [both correct]"

      - name: Execute lambda witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-lambda)" = "7"

      - name: Execute bounded recursion witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-countdown)" = "countdown 100000 -> done"

      - name: Execute Stage2 closure identity witness
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-closure)" = "closure identity: definition=17 env=42 self-eq=t peer-eq=()"

      - name: Execute cond-branching witness (wsm-my-lisp#4, real cml front end)
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-cond)" = "cond: (cond (() (quote wrong)) (t (quote right))) -> right"

      - name: Execute quote witness (wsm-my-lisp#4, real cml front end)
        shell: bash
        run: |
          test "$(cargo run --quiet --manifest-path harness/Cargo.toml --locked --bin harness-quote)" = "quote: (quote radio) -> radio"
